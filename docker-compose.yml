services:
  # One-shot: idempotently generates the local development root CA (see
  # localca) that Caddy signs all its local certs from (see
  # etc/caddy/Caddyfile's "pki" block), under ${OWNSCALE_DATA_DIR}/local-ca.
  # Present (and harmless/unused) when using a real domain.
  local-ca-init:
    image: ownscale:latest
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /app/osa gen-local-ca --caddy-data-dir /caddy-data &&
        chown -R "${HOST_UID:-0}:${HOST_GID:-0}" "$$OWNSCALE_DATA_DIR/local-ca"
    environment:
      OWNSCALE_DATA_DIR: ${OWNSCALE_DATA_DIR:?set OWNSCALE_DATA_DIR to an absolute host path in .env}
    volumes:
      - ${OWNSCALE_DATA_DIR}:${OWNSCALE_DATA_DIR}
      - caddy-data:/caddy-data
    networks:
      - os-net

  ownscale:
    image: ownscale:latest
    build: .
    depends_on:
      local-ca-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      OWNSCALE_ADDR: ${OWNSCALE_ADDR:-:8080}
      OWNSCALE_BASE_DOMAIN: ${BASE_DOMAIN:-ownscale.test}
      OWNSCALE_DATA_DIR: ${OWNSCALE_DATA_DIR:?set OWNSCALE_DATA_DIR to an absolute host path in .env}
      OWNSCALE_LOCAL_CA_DIR: ${OWNSCALE_LOCAL_CA_DIR:-local-ca}
      OWNSCALE_DEVELOPMENT: ${OWNSCALE_DEVELOPMENT:-}
      SSL_CERT_DIR: /etc/ssl/certs:/etc/pki/tls/certs:${OWNSCALE_DATA_DIR}/local-ca
      OWNSCALE_AUTH_SESSION_SECRET: ${OWNSCALE_AUTH_SESSION_SECRET:?set OWNSCALE_AUTH_SESSION_SECRET in .env}
      OWNSCALE_AUTH_UPSTREAM_OIDC_ISSUER: ${OWNSCALE_AUTH_UPSTREAM_OIDC_ISSUER:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_ID: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_ID:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_SECRET: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_SECRET:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CALLBACK_URL: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CALLBACK_URL:-}
      OWNSCALE_AUTH_GOOGLE_CLIENT_ID: ${OWNSCALE_AUTH_GOOGLE_CLIENT_ID:-}
      OWNSCALE_AUTH_GOOGLE_CLIENT_SECRET: ${OWNSCALE_AUTH_GOOGLE_CLIENT_SECRET:-}
      OWNSCALE_AUTH_GOOGLE_CALLBACK_URL: ${OWNSCALE_AUTH_GOOGLE_CALLBACK_URL:-}
      OWNSCALE_AUTH_MICROSOFT_CLIENT_ID: ${OWNSCALE_AUTH_MICROSOFT_CLIENT_ID:-}
      OWNSCALE_AUTH_MICROSOFT_CLIENT_SECRET: ${OWNSCALE_AUTH_MICROSOFT_CLIENT_SECRET:-}
      OWNSCALE_AUTH_MICROSOFT_CALLBACK_URL: ${OWNSCALE_AUTH_MICROSOFT_CALLBACK_URL:-}
      OWNSCALE_AUTH_OIDC_PROVIDER_ISSUER: ${OWNSCALE_AUTH_OIDC_PROVIDER_ISSUER:-}
      OWNSCALE_AUTH_OIDC_PROVIDER_SIGNING_KEY_PATH: ${OWNSCALE_AUTH_OIDC_PROVIDER_SIGNING_KEY_PATH:-oidc_signing_key.pem}
      OWNSCALE_AUTH_OIDC_PROVIDER_ACCESS_TOKEN_LIFETIME: ${OWNSCALE_AUTH_OIDC_PROVIDER_ACCESS_TOKEN_LIFETIME:-5m}
      OWNSCALE_AUTH_OIDC_PROVIDER_ID_TOKEN_LIFETIME: ${OWNSCALE_AUTH_OIDC_PROVIDER_ID_TOKEN_LIFETIME:-1h}
      OWNSCALE_LOG_LEVEL: ${OWNSCALE_LOG_LEVEL:-info}
      OWNSCALE_LOG_FORMAT: ${OWNSCALE_LOG_FORMAT:-json}
      OWNSCALE_DEBUG_ADDR: ${OWNSCALE_DEBUG_ADDR:-}
      OWNSCALE_DERP_MAP_URL: ${OWNSCALE_DERP_MAP_URL:-}
      # Inject litestream's vars too because we use litestream to verify dbs
      # against the replication backups (an to restore, in case they're missing/dirty)
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_AZURE_ACCOUNT_KEY: ${LITESTREAM_AZURE_ACCOUNT_KEY:-}
    volumes:
      - ${OWNSCALE_DATA_DIR}:${OWNSCALE_DATA_DIR}
    networks:
      - os-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dex:
    image: dexidp/dex:v2.45.1
    # dex's config loader has no env-var interpolation of its own (unlike
    # Caddy's Caddyfile or litestream's config), so this sed-renders
    # config.yaml's $BASE_DOMAIN placeholder into a real config file
    # under /tmp before starting dex, using the stock dexidp/dex image
    # unmodified (the image already ships sed).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s/\$$BASE_DOMAIN/$$BASE_DOMAIN/g" /etc/dex/config.yaml > /tmp/dex-config.yaml &&
        exec dex serve /tmp/dex-config.yaml
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-ownscale.test}
    volumes:
      - ./etc/dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - os-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5556/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Replicates every SQLite database under ${PWD}/data to a remote
  # destination (see etc/litestream/litestream.yaml and .env.example).
  litestream:
    image: litestream/litestream:0.5.16
    command: ["replicate", "-config", "/etc/litestream/config.yaml"]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      OWNSCALE_DATA_DIR: ${PWD}/data
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-10s}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_AZURE_ACCOUNT_KEY: ${LITESTREAM_AZURE_ACCOUNT_KEY:-}
    volumes:
      # litestream LTX-based writes internal bookkeeping tables.
      # the volume must be writable
      - ${PWD}/data:${PWD}/data
      - ./etc/litestream/config.yaml:/etc/litestream/config.yaml:ro
      - ${OWNSCALE_DATA_DIR}/.litestream-backups:/var/lib/litestream/backups
    networks:
      - os-net
    restart: unless-stopped

  caddy:
    image: ownscale-caddy:latest
    build:
      context: ./etc/caddy
    depends_on:
      local-ca-init:
        condition: service_completed_successfully
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-ownscale.test}
      CADDY_LOG_LEVEL: ${CADDY_LOG_LEVEL:-debug}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
      OWNSCALE_DEVELOPMENT: ${OWNSCALE_DEVELOPMENT:-}
      DNS_PROVIDER: ${DNS_PROVIDER:-none}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP_NAME: ${AZURE_RESOURCE_GROUP_NAME:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN:-}
    ports:
      - "${CADDY_LISTEN_IP:-0.0.0.0}:80:80"
      - "${CADDY_LISTEN_IP:-0.0.0.0}:443:443"
      - "${CADDY_LISTEN_IP:-0.0.0.0}:443:443/udp"
    volumes:
      - ./etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./etc/caddy/providers:/etc/caddy/providers:ro
      - ./etc/caddy/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${OWNSCALE_DATA_DIR}/local-ca:/etc/ownscale-local-ca:ro
    networks:
      os-net:
        # Non-public BASE_DOMAINs (e.g. "ownscale.test") have no real DNS, so
        # the ownscale service's outbound HTTPS calls must resolve these names
        # to Caddy: Dex (auth.upstream_oidc.issuer) and the console itself
        # (the OIDC issuer the in-process headscale instances discover).
        aliases:
          - dex.${BASE_DOMAIN:-ownscale.test}
          - console.${BASE_DOMAIN:-ownscale.test}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

networks:
  os-net:
    name: os-net
