# Local development overlay for compose.yaml: adds a local root CA and Dex
# as the upstream OIDC provider, and sets every dev value on top of .env.
# Enabled via COMPOSE_FILE, which `make dev-up` writes into .env.
services:
  # One-shot: idempotently generates the local development root CA (see
  # localca) that Caddy signs all its local certs from (see
  # etc/caddy/dev/global.caddyfile), under the data directory's local-ca/.
  local-ca-init:
    image: ownscale:latest
    build:
      context: .
      args:
        VERSION: ${BUILD_VERSION:-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        osa gen-local-ca --caddy-data-dir /caddy-data &&
        chown -R "${HOST_UID:-0}:${HOST_GID:-0}" "$$OWNSCALE_DATA_DIR/local-ca"
    environment:
      OWNSCALE_DATA_DIR: /data
    volumes:
      - ${OWNSCALE_DATA_DIR:-./data}:/data
      - caddy-data:/caddy-data

  dex:
    image: dexidp/dex:v2.46.1
    # dex's config loader has no env-var interpolation of its own (unlike
    # Caddy's Caddyfile), so this sed-renders
    # config.yaml's $BASE_DOMAIN placeholder into a real config file
    # under /tmp before starting dex, using the stock dexidp/dex image
    # unmodified (the image already ships sed).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s/\$$BASE_DOMAIN/$$BASE_DOMAIN/g" /etc/dex/config.yaml > /tmp/dex-config.yaml &&
        exec dex serve /tmp/dex-config.yaml
    environment:
      BASE_DOMAIN: ownscale.test
    volumes:
      - ./etc/dex/config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5556/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ownscale:
    image: ownscale:latest
    build:
      context: .
      args:
        VERSION: ${BUILD_VERSION:-dev}
    depends_on:
      local-ca-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    environment:
      OWNSCALE_BASE_DOMAIN: ownscale.test
      OWNSCALE_CONTENT_DOMAIN: ownscale.test
      OWNSCALE_DEVELOPMENT: "true"
      OWNSCALE_LOG_FORMAT: text
      OWNSCALE_DNS_PROVIDER: none
      OWNSCALE_AUTH_SESSION_SECRET: dev-session-secret
      # Dex, with test logins aaaa@ownscale.test ... jjjj@ownscale.test / ownscale.
      OWNSCALE_AUTH_UPSTREAM_OIDC_ISSUER: https://dex.ownscale.test
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_ID: ownscale
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_SECRET: ownscale-dev-secret
      OWNSCALE_AUTH_UPSTREAM_OIDC_CALLBACK_URL: https://console.ownscale.test/auth/oidc/callback
      SSL_CERT_DIR: /etc/ssl/certs:/etc/pki/tls/certs:/data/local-ca
      # Dex user aaaa@ownscale.test gets subdomain aaaa, and so on; the e2e
      # setup relies on it.
      OWNSCALE_FIXED_SUBDOMAINS: aaaa,bbbb,cccc,dddd,eeee,ffff,gggg,hhhh,iiii,jjjj

  caddy:
    image: ownscale-caddy:latest
    profiles: !reset []
    build:
      context: .
      dockerfile: etc/caddy/Dockerfile
      args:
        VERSION: ${BUILD_VERSION:-dev}
    depends_on:
      local-ca-init:
        condition: service_completed_successfully
    environment:
      BASE_DOMAIN: ownscale.test
      CONTENT_DOMAIN: ownscale.test
      # local: wildcard certificates from the local CA, see etc/caddy/dev.
      DNS_PROVIDER: local
      CADDY_LOG_LEVEL: debug
    # Bind mounts override the baked-in Caddyfile so edits only
    # need a restart; dev/ holds the local_certs, PKI and Dex snippets.
    volumes:
      - ./etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./etc/caddy/dev:/etc/caddy/dev:ro
      - ${OWNSCALE_DATA_DIR:-./data}/local-ca:/etc/ownscale-local-ca:ro
    networks:
      default:
        # Non-public BASE_DOMAINs (e.g. "ownscale.test") have no real DNS, so
        # the ownscale service's outbound HTTPS calls must resolve these names
        # to Caddy: Dex (auth.upstream_oidc.issuer) and the console itself
        # (the OIDC issuer the in-process headscale instances discover).
        aliases:
          - dex.ownscale.test
          - console.ownscale.test
