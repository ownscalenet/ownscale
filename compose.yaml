# Production stack: ownscale behind Caddy. Local development layers
# compose.dev.yaml on top (see COMPOSE_FILE in .env.example).
services:
  ownscale:
    image: ownscale:latest
    build: .
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      OWNSCALE_BASE_DOMAIN: ${BASE_DOMAIN:-ownscale.test}
      OWNSCALE_FUNNEL_DOMAIN: ${FUNNEL_DOMAIN:-${BASE_DOMAIN:-ownscale.test}}
      OWNSCALE_FUNNEL_MAX_BODY_BYTES: ${FUNNEL_MAX_BODY_BYTES:-33554432}
      OWNSCALE_DATA_DIR: ${OWNSCALE_DATA_DIR:?set OWNSCALE_DATA_DIR to an absolute host path in .env}
      OWNSCALE_DEVELOPMENT: ${OWNSCALE_DEVELOPMENT:-}
      OWNSCALE_AUTH_SESSION_SECRET: ${OWNSCALE_AUTH_SESSION_SECRET:?set OWNSCALE_AUTH_SESSION_SECRET in .env}
      OWNSCALE_AUTH_UPSTREAM_OIDC_ISSUER: ${OWNSCALE_AUTH_UPSTREAM_OIDC_ISSUER:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_ID: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_ID:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_SECRET: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CLIENT_SECRET:-}
      OWNSCALE_AUTH_UPSTREAM_OIDC_CALLBACK_URL: ${OWNSCALE_AUTH_UPSTREAM_OIDC_CALLBACK_URL:-}
      OWNSCALE_AUTH_GOOGLE_CLIENT_ID: ${OWNSCALE_AUTH_GOOGLE_CLIENT_ID:-}
      OWNSCALE_AUTH_GOOGLE_CLIENT_SECRET: ${OWNSCALE_AUTH_GOOGLE_CLIENT_SECRET:-}
      OWNSCALE_AUTH_GOOGLE_CALLBACK_URL: ${OWNSCALE_AUTH_GOOGLE_CALLBACK_URL:-}
      OWNSCALE_AUTH_MICROSOFT_CLIENT_ID: ${OWNSCALE_AUTH_MICROSOFT_CLIENT_ID:-}
      OWNSCALE_AUTH_MICROSOFT_CLIENT_SECRET: ${OWNSCALE_AUTH_MICROSOFT_CLIENT_SECRET:-}
      OWNSCALE_AUTH_MICROSOFT_CALLBACK_URL: ${OWNSCALE_AUTH_MICROSOFT_CALLBACK_URL:-}
      OWNSCALE_AUTH_OIDC_PROVIDER_ISSUER: ${OWNSCALE_AUTH_OIDC_PROVIDER_ISSUER:-}
      OWNSCALE_AUTH_OIDC_PROVIDER_SIGNING_KEY_PATH: ${OWNSCALE_AUTH_OIDC_PROVIDER_SIGNING_KEY_PATH:-oidc_signing_key.pem}
      OWNSCALE_AUTH_OIDC_PROVIDER_ACCESS_TOKEN_LIFETIME: ${OWNSCALE_AUTH_OIDC_PROVIDER_ACCESS_TOKEN_LIFETIME:-5m}
      OWNSCALE_AUTH_OIDC_PROVIDER_ID_TOKEN_LIFETIME: ${OWNSCALE_AUTH_OIDC_PROVIDER_ID_TOKEN_LIFETIME:-1h}
      OWNSCALE_LOG_LEVEL: ${OWNSCALE_LOG_LEVEL:-info}
      OWNSCALE_LOG_FORMAT: ${OWNSCALE_LOG_FORMAT:-json}
      OWNSCALE_DEBUG_ADDR: ${OWNSCALE_DEBUG_ADDR:-}
      OWNSCALE_DERP_MAP_URL: ${OWNSCALE_DERP_MAP_URL:-}
      OWNSCALE_BACKUP_REPLICA_URL: ${OWNSCALE_BACKUP_REPLICA_URL:-}
      OWNSCALE_BACKUP_ACCESS_KEY_ID: ${OWNSCALE_BACKUP_ACCESS_KEY_ID:-}
      OWNSCALE_BACKUP_SECRET_ACCESS_KEY: ${OWNSCALE_BACKUP_SECRET_ACCESS_KEY:-}
      OWNSCALE_BACKUP_REGION: ${OWNSCALE_BACKUP_REGION:-}
      OWNSCALE_BACKUP_ENDPOINT: ${OWNSCALE_BACKUP_ENDPOINT:-}
      OWNSCALE_BACKUP_AZURE_ACCOUNT_KEY: ${OWNSCALE_BACKUP_AZURE_ACCOUNT_KEY:-}
      OWNSCALE_BACKUP_SYNC_INTERVAL: ${OWNSCALE_BACKUP_SYNC_INTERVAL:-10s}
    volumes:
      - ${OWNSCALE_DATA_DIR}:${OWNSCALE_DATA_DIR}
    networks:
      - os-net
    restart: unless-stopped
    stop_grace_period: 40s # close connections, close replication
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: ownscale-caddy:latest
    build:
      context: .
      dockerfile: etc/caddy/Dockerfile
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-ownscale.test}
      FUNNEL_DOMAIN: ${FUNNEL_DOMAIN:-${BASE_DOMAIN:-ownscale.test}}
      CADDY_LOG_LEVEL: ${CADDY_LOG_LEVEL:-info}
      OWNSCALE_DEVELOPMENT: ${OWNSCALE_DEVELOPMENT:-}
      DNS_PROVIDER: ${DNS_PROVIDER:-none}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP_NAME: ${AZURE_RESOURCE_GROUP_NAME:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN:-}
    ports:
      - "${CADDY_LISTEN_IP:-0.0.0.0}:80:80"
      - "${CADDY_LISTEN_IP:-0.0.0.0}:443:443"
      - "${CADDY_LISTEN_IP:-0.0.0.0}:443:443/udp"
    # Caddyfile, DNS providers and docs site are baked into the image.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - os-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

networks:
  os-net:
    name: os-net
