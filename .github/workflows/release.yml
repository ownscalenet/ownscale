name: Release deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-deployment-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate existing release
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ && ${#TAG} -le 128 ]] || {
            echo "::error::Invalid release tag"
            exit 1
          }
          gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"
          test "$(cat "$RUNNER_TEMP/is-draft")" = false

      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: source
          persist-credentials: false

      - name: Validate Compose images
        working-directory: source
        run: |
          OWNSCALE_VERSION="$TAG" OWNSCALE_AUTH_SESSION_SECRET=ci \
            docker compose -f compose.yaml config --format json > "$RUNNER_TEMP/compose.json"
          jq -e --arg tag "$TAG" '
            (.services | keys) == ["caddy", "ownscale"] and
            .services.ownscale.image == ("ghcr.io/ownscalenet/ownscale:" + $tag) and
            .services.caddy.image == ("ghcr.io/ownscalenet/ownscale-caddy:" + $tag) and
            ([.services[] | has("build")] | any | not)
          ' "$RUNNER_TEMP/compose.json"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Build tagged frontend
        working-directory: source/frontend
        run: |
          npm ci
          npm run build
          # Tailscale WASM client for browser SSH; same as `make frontend`.
          cp node_modules/@tailscale/connect/main.wasm.zst ../webui/dist/assets/
          test -s ../webui/dist/assets/index.js
          test -s ../webui/dist/assets/main.wasm.zst
          # Fails on a wasm client that panics at startup (uses the runner's Go).
          npm run check:wasm

      - name: Resolve source revision
        id: revision
        working-directory: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build tagged docs
        working-directory: source
        env:
          HUGO_VERSION: 0.169.0
          HUGO_SHA256: c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d
          HUGO_PARAMS_VERSION: ${{ steps.revision.outputs.version }}
          # Hugo modules need docs/go.mod's Go version.
          GOTOOLCHAIN: auto
        run: |
          tarball="$RUNNER_TEMP/hugo.tar.gz"
          curl --fail --silent --show-error --location -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "$HUGO_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" hugo
          find docsite/dist -mindepth 1 ! -name .gitkeep -delete
          "$RUNNER_TEMP/hugo" --source docs --destination ../docsite/dist --minify
          grep -q "$HUGO_PARAMS_VERSION" docsite/dist/index.html
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build ownscale image
        uses: docker/build-push-action@v7.4.0
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ownscalenet/ownscale:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          build-args: VERSION=${{ steps.revision.outputs.version }}
          cache-from: type=gha,scope=ownscale
          cache-to: type=gha,mode=max,scope=ownscale
      - name: Build Caddy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: source
          file: source/etc/caddy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ownscalenet/ownscale-caddy:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          build-args: VERSION=${{ steps.revision.outputs.version }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Smoke-test packaged images
        run: |
          docker run --rm --entrypoint osa "ghcr.io/ownscalenet/ownscale:$TAG" --help
          docker run --rm -e TAG --entrypoint sh "ghcr.io/ownscalenet/ownscale:$TAG" -c 'strings /bin/ownscale | grep -q "$TAG-[0-9a-f]\{7,\}"'
          docker run --rm -e TAG --entrypoint sh "ghcr.io/ownscalenet/ownscale-caddy:$TAG" -ec '
            test -s /etc/caddy/Caddyfile
            caddy list-modules | grep -q dns.providers.cloudflare
          '
      - name: Verify embedded frontend and docs over HTTP
        shell: bash
        run: |
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs ownscale-release-smoke; fi
            docker rm -f ownscale-release-smoke
            exit "$result"
          }
          docker run -d --name ownscale-release-smoke -p 127.0.0.1::8080 \
            -e OWNSCALE_BASE_DOMAIN=example.com \
            -e OWNSCALE_DATA_DIR=/tmp/ownscale-data \
            -e OWNSCALE_AUTH_SESSION_SECRET=release-smoke-only \
            "ghcr.io/ownscalenet/ownscale:$TAG"
          trap cleanup EXIT
          address=$(docker port ownscale-release-smoke 8080/tcp)
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-all-errors -H 'Host: console.example.com' \
            "http://$address/login" -o "$RUNNER_TEMP/login.html"
          cmp source/webui/dist/index.html "$RUNNER_TEMP/login.html"
          curl --fail --silent --show-error -H 'Host: console.example.com' \
            "http://$address/assets/index.js" -o "$RUNNER_TEMP/index.js"
          cmp source/webui/dist/assets/index.js "$RUNNER_TEMP/index.js"
          curl --fail --silent --show-error -H 'Host: console.example.com' \
            -H 'Accept-Encoding: zstd' \
            "http://$address/assets/main.wasm" -o "$RUNNER_TEMP/main.wasm.zst"
          cmp source/webui/dist/assets/main.wasm.zst "$RUNNER_TEMP/main.wasm.zst"
          # Clients without zstd get the module decompressed.
          curl --fail --silent --show-error -H 'Host: console.example.com' \
            -H 'Accept-Encoding: gzip' \
            "http://$address/assets/main.wasm" -o "$RUNNER_TEMP/main.wasm"
          zstd -dc source/webui/dist/assets/main.wasm.zst | cmp - "$RUNNER_TEMP/main.wasm"
          curl --fail --silent --show-error -H 'Host: example.com' \
            "http://$address/" -o "$RUNNER_TEMP/docs.html"
          cmp source/docsite/dist/index.html "$RUNNER_TEMP/docs.html"
      - name: Publish release tags
        run: |
          for image in ownscale ownscale-caddy; do
            docker push "ghcr.io/ownscalenet/$image:$TAG"
          done
          # Prereleases and backfills of older tags don't move latest.
          if [ "$(gh release view --json tagName --jq .tagName)" = "$TAG" ]; then
            for image in ownscale ownscale-caddy; do
              docker tag "ghcr.io/ownscalenet/$image:$TAG" "ghcr.io/ownscalenet/$image:latest"
              docker push "ghcr.io/ownscalenet/$image:latest"
            done
          fi
