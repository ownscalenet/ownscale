name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go fix ./...
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Validate Compose files
        env:
          OWNSCALE_AUTH_SESSION_SECRET: ci
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go mod tidy
      - name: Check go.mod/go.sum are up to date
        run: git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

      - name: Check for dead code
        run: |
          go run golang.org/x/tools/cmd/deadcode@latest ./cmd/...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
