name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go fix ./...
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Validate Compose files
        env:
          OWNSCALE_AUTH_SESSION_SECRET: ci
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Test install.sh
        run: |
          shellcheck -s sh install.sh install_test.sh
          sh install_test.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go mod tidy
      - name: Check go.mod/go.sum are up to date
        run: git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

      - name: Check for dead code
        run: |
          go run golang.org/x/tools/cmd/deadcode@latest --test ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Go's Node runner executes the Tailscale WASM client in check:wasm.
      # No cache: this job builds nothing, and as the first to finish it would
      # save an empty cache under the go.sum key every other job restores.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run check:wasm

  e2e:
    name: E2E checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/frontend/package-lock.json
      # The contract tests build and run tscl-bridge.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The e2e tests import the console's API types.
      - run: npm ci --prefix ../../frontend
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:connectivity:contract
