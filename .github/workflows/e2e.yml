name: E2E

# Runs `make e2e` against a local development stack (`make dev-up`).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: make e2e on the dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/frontend/package-lock.json

      # The images embed the host-built frontend. No e2e test needs the docs
      # site, so Caddy gets an empty one instead of a hugo build.
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          cp frontend/node_modules/@tailscale/connect/main.wasm.zst webui/dist/assets/
          mkdir -p etc/caddy/site

      - name: Map *.ownscale.test to localhost
        run: |
          names="ownscale.test console.ownscale.test dex.ownscale.test"
          for org in aaaa bbbb cccc dddd eeee ffff gggg hhhh iiii jjjj; do
            names="$names $org.ownscale.test web1-$org.ownscale.test web2-$org.ownscale.test"
          done
          echo "127.0.0.1 $names" | sudo tee -a /etc/hosts

      # Prebuilt with caching, so dev-up runs without BUILD=1. xcaddy only
      # changes with the Dockerfile, so the layer cache covers it; the Go build
      # changes every commit and needs its cache mounts restored instead.
      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx
      - uses: actions/cache@v6.1.0
        id: go-cache
        with:
          path: go-cache-mount
          key: e2e-go-cache-mount-${{ hashFiles('go.sum', 'Dockerfile') }}
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: go-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ownscale:latest
          cache-from: type=gha,scope=e2e-ownscale
          cache-to: type=gha,scope=e2e-ownscale,mode=max
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: etc/caddy/Dockerfile
          load: true
          tags: ownscale-caddy:latest
          cache-from: type=gha,scope=e2e-caddy
          cache-to: type=gha,scope=e2e-caddy,mode=max

      - run: make dev-up DETACH=1

      - name: Wait for the console
        run: |
          for _ in $(seq 60); do
            curl -fsS -o /dev/null --cacert data/local-ca/root.crt https://console.ownscale.test && exit 0
            sleep 2
          done
          docker compose ps
          exit 1

      - run: npm --prefix e2e/frontend ci
      - run: npx --prefix e2e/frontend playwright install --with-deps chromium
      - run: make e2e

      - name: Collect stack logs
        if: failure()
        run: docker compose logs --no-color > compose.log 2>&1
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/frontend/test-results
            compose.log
