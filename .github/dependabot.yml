version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /docs
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e/frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/derper
      - /e2e/devbox
      - /etc/caddy
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      nix:
        patterns: ["*"]
