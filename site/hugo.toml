baseURL = "/"
locale = "en-US"
title = "ownscale Documentation"

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats]
  [outputFormats.search]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "search"]

[params]
  BookTheme = "auto"
  BookToC = true
  BookSection = "docs"
  BookRepo = "https://github.com/ownscalenet/ownscale"
  BookEditPath = "edit/main/site/content"
  BookSearch = false
  BookComments = false
  BookPortableLinks = true

[menu]
  [[menu.after]]
    name = "GitHub"
    url = "https://github.com/ownscalenet/ownscale"
    weight = 10

  [[menu.after]]
    name = "Login"
    url = "/login"
    weight = 20
    [menu.after.params]
      class = "ownscale-login-link"
