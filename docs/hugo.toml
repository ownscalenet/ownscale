baseURL = "/"
locale = "en-US"
title = "ownscale"

[module]
  # Fetch the theme through the Go module proxy rather than git.
  proxy = "https://proxy.golang.org,direct"
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  # Repository for the edit and view-source buttons next to page titles.
  repo = "https://github.com/ownscalenet/ownscale"

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  # The edit and view-source buttons next to page titles replace the
  # theme's "Edit this page" link.
  [params.editURL]
    enable = false

  [params.highlight.copy]
    enable = true
    display = "hover"

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1

  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/ownscalenet/ownscale"
    weight = 3
    [menu.main.params]
      icon = "github"

  [[menu.main]]
    name = "Login"
    url = "/login"
    weight = 4
