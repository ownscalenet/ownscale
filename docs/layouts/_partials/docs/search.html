<!-- Project override of hugo-book's docs/search partial: this is a form
     that navigates to /search/ with the typed query instead of the
     theme's Fuse dropdown. -->
<div class="book-search">
  <form action="{{ "/search/" | relURL }}" method="get">
    <input id="book-search-input" name="q" type="text"
      placeholder="{{ partial "docs/text/i18n" "Search" }}"
      aria-label="{{ partial "docs/text/i18n" "Search" }}"
      maxlength="64" />
  </form>
</div>
