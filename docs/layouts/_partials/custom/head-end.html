{{/*
  The console lives on its own subdomain, so point the navbar's Login link
  and the homepage's "Try online" button there. Hextra's menu items and
  buttons can't carry a class, so match by href.
*/}}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var consoleURL = 'https://console.' + window.location.hostname + '/login';
  document.querySelectorAll('a[href="/login"]').forEach(function (link) {
    link.href = consoleURL;
  });
});
</script>
