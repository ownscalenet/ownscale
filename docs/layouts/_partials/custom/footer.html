{{- $repo := site.Params.repo -}}
<div class="ownscale-footer">
  <div class="ownscale-footer-brand">
    <img src="{{ "logo.svg" | relURL }}" class="hx:block hx:dark:hidden" width="20" height="20" alt="" />
    <img src="{{ "logo-dark.svg" | relURL }}" class="hx:hidden hx:dark:block" width="20" height="20" alt="" />
    <span>Ownscale</span>
    <span class="ownscale-footer-muted">Self-hosted mesh VPN, built on <a href="https://headscale.net" target="_blank" rel="noopener">Headscale</a></span>
  </div>
  <nav class="ownscale-footer-links">
    <a href="{{ "docs/" | relURL }}">Docs</a>
    <a href="{{ "docs/faqs/" | relURL }}">FAQs</a>
    <a href="{{ $repo }}" target="_blank" rel="noopener">GitHub</a>
    <a href="{{ $repo }}/blob/master/.github/CONTRIBUTING.md" target="_blank" rel="noopener">Contributing</a>
    <a href="{{ $repo }}/blob/master/LICENSE" target="_blank" rel="noopener">BSD-3-Clause</a>
  </nav>
</div>
