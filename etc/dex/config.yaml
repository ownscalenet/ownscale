# dexidp/dex configuration for local development only (see compose.dev.yaml's
# "dex" service and etc/caddy/dev/sites.caddyfile).
#
# $BASE_DOMAIN is replaced with the dev domain set in compose.dev.yaml.
issuer: https://dex.$BASE_DOMAIN

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Skip Dex's own "allow ownscale to access your profile?" consent screen:
  # there's exactly one client (ownscale itself), so the extra click has no value in local dev.
  skipApprovalScreen: true

staticClients:
  - id: ownscale
    secret: ownscale-dev-secret
    name: "ownscale (local dev)"
    redirectURIs:
      - https://console.$BASE_DOMAIN/auth/oidc/callback

enablePasswordDB: true
staticPasswords:
  # Every user's password is "ownscale" -- see README.md for how to generate
  # your own hash. aaaa..jjjj land on the subdomain they're named after
  # (OWNSCALE_FIXED_SUBDOMAINS); e2e/README.md lists what each one is for.
  - email: "aaaa@ownscale.test"
    hash: "$2b$12$393bqrQ./sduEOViwHyF7.1JBDkXUkUfFze/dj2P0GP7/Cgx4R3WW"
    username: "aaaa"
    userID: "6f0e6f1c-3c1e-4b8e-9d55-000000000000"
