# dexidp/dex configuration for local development only (see compose.dev.yaml's
# "dex" service and etc/caddy/dev/sites.caddyfile).
#
# $BASE_DOMAIN is replaced with the dev domain set in compose.dev.yaml.
issuer: https://dex.$BASE_DOMAIN

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Skip Dex's own "allow ownscale to access your profile?" consent screen:
  # there's exactly one client (ownscale itself) and one local test user,
  # so the extra click has no value in local dev.
  skipApprovalScreen: true

staticClients:
  - id: ownscale
    secret: ownscale-dev-secret
    name: "ownscale (local dev)"
    redirectURIs:
      - https://console.$BASE_DOMAIN/auth/oidc/callback

enablePasswordDB: true
staticPasswords:
  - email: "admin@ownscale.test"
    # bcrypt hash of "ownscale" -- see README.md for how to generate your own.
    hash: "$2b$12$393bqrQ./sduEOViwHyF7.1JBDkXUkUfFze/dj2P0GP7/Cgx4R3WW"
    username: "admin"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
