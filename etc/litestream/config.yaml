# Litestream config: continuously replicates every SQLite database found
# under OWNSCALE_DATA_DIR, using the directory watcher feature so newly
# created/removed databases are picked up automatically without restarting
# litestream. See https://litestream.io/guides/directory-watcher/.

logging:
  type: json
  level: warn
  source: true

dbs:

  # Every organization's headscale database, one level down per subdomain.
  # Recursive + watch so organizations created/removed at runtime are
  # picked up within seconds, without restarting litestream.
  - dir: ${OWNSCALE_DATA_DIR}
    pattern: "*.sqlite"
    recursive: true
    watch: true
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      region: ${LITESTREAM_REGION}
      endpoint: ${LITESTREAM_ENDPOINT}
      sync-interval: ${LITESTREAM_SYNC_INTERVAL}
